<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StudyAI Study Material - Class 6-12, B.Com, SSC, MTS, CHSL, CGL, UPSC, Banking, Railway, Haryana CET, State Exams.">
  <title>Study Material - StudyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <span>Study<span class="gradient-text">AI</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="study-material.html" class="nav-link active">Study Material</a>
        <a href="pdf-library.html" class="nav-link">PDF Library</a>
        <a href="quiz.html" class="nav-link">Quizzes</a>
        <a href="ai-assistant.html" class="nav-link">AI Assistant</a>
        <a href="videos.html" class="nav-link">Videos</a>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn-primary btn-sm" id="login-btn" onclick="openModal('auth-modal')">Login</button>
        <div class="user-menu hidden" id="user-menu"><button class="icon-btn"><i class="fas fa-user-circle"></i></button></div>
        <button class="mobile-menu-btn" onclick="toggleMobileNav()"><i class="fas fa-bars"></i></button>
      </div>
    </div>
  </nav>
  <div class="mobile-nav" id="mobile-nav">
    <a href="index.html" class="nav-link">Home</a>
    <a href="study-material.html" class="nav-link">Study Material</a>
    <a href="pdf-library.html" class="nav-link">PDF Library</a>
    <a href="quiz.html" class="nav-link">Quizzes</a>
  </div>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">📚 Study Material</h1>
      <p class="page-subtitle">Comprehensive resources for every exam and class</p>
      <div class="search-container mt-3" style="max-width:500px;">
        <div class="search-bar">
          <i class="fas fa-search" style="color:var(--text-muted);"></i>
          <input type="text" id="material-search" placeholder="Search subjects, topics..." oninput="filterMaterials(this.value)">
        </div>
      </div>
    </div>
  </div>

  <section class="section" style="padding-top:1rem;">
    <div class="container">
      <!-- Category Filters -->
      <div class="flex gap-2 mb-3" style="flex-wrap:wrap;" id="cat-filters">
        <button class="btn btn-primary btn-sm cat-btn active" data-cat="all">All</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="class6-12">Class 6-12</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="bcom">B.Com</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="ssc">SSC</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="mts">MTS</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="chsl">CHSL</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="cgl">CGL</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="upsc">UPSC</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="banking">Banking</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="railway">Railway</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="haryana">Haryana CET</button>
        <button class="btn btn-secondary btn-sm cat-btn" data-cat="state">State Exams</button>
      </div>

      <div class="courses-grid" id="materials-grid">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="read-modal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header"><h3 id="read-title">Notes</h3><button class="modal-close" onclick="closeModal('read-modal')"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <div id="read-content" style="white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);max-height:60vh;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <div class="modal-header"><h3>Login</h3><button class="modal-close" onclick="closeModal('auth-modal')"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <form id="login-form">
          <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-input" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-password" class="form-input" required></div>
          <button type="submit" class="btn btn-primary w-full">Login</button>
        </form>
        <form id="signup-form" class="hidden">
          <div class="form-group"><label>Name</label><input type="text" id="signup-name" class="form-input" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="signup-email" class="form-input" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="signup-password" class="form-input" required></div>
          <button type="submit" class="btn btn-primary w-full">Sign Up</button>
        </form>
        <div class="divider">or</div>
        <button class="btn btn-secondary w-full" onclick="StudyAI.AuthManager.googleLogin()"><i class="fab fa-google"></i> Google</button>
      </div>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <script src="db.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
  <script>
    let materials = [];

    function renderMaterials(list) {
      const grid = document.getElementById('materials-grid');
      grid.innerHTML = list.map(m => `
        <div class="course-card" data-cat="${m.category}">
          <div class="course-thumb" style="background:linear-gradient(135deg,${m.color},${m.color}cc);">
            <i class="fas ${m.icon}"></i>
          </div>
          <div class="course-body">
            <h3 class="course-title">${m.title}</h3>
            <div class="course-meta">
              <span><i class="fas fa-align-left"></i> ${estimateReadTime(m.content)} min read</span>
            </div>
            <div class="course-footer">
              <div class="course-rating"><i class="fas fa-book-open"></i> Notes</div>
              <button class="btn btn-primary btn-sm" onclick="openMaterial(${m.id})">Open</button>
            </div>
          </div>
        </div>
      `).join('') || '<p style="color:var(--text-muted);grid-column:1/-1;">No study material added yet. Ask an admin to add some from the Admin panel.</p>';
    }

    function estimateReadTime(text) {
      const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words / 200));
    }

    function openMaterial(id) {
      const m = materials.find(x => x.id === id);
      if (!m) return;
      document.getElementById('read-title').textContent = m.title;
      document.getElementById('read-content').textContent = m.content;
      openModal('read-modal');
    }

    function filterMaterials(query) {
      const q = query.toLowerCase();
      const activeCat = document.querySelector('.cat-btn.active')?.dataset.cat || 'all';
      let filtered = materials;
      if (activeCat !== 'all') filtered = filtered.filter(m => m.category === activeCat);
      if (q) filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
      renderMaterials(filtered);
    }

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('active', 'btn-primary');
          b.classList.add('btn-secondary');
        });
        btn.classList.add('active', 'btn-primary');
        btn.classList.remove('btn-secondary');
        filterMaterials(document.getElementById('material-search').value);
      });
    });

    async function loadMaterials() {
      document.getElementById('materials-grid').innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
      try {
        const res = await fetch('/api/materials');
        materials = await res.json();
      } catch {
        materials = [];
      }
      // URL param support
      const params = new URLSearchParams(location.search);
      const cat = params.get('cat');
      if (cat) {
        const btn = document.querySelector(`[data-cat="${cat}"]`);
        if (btn) { btn.click(); return; }
      }
      renderMaterials(materials);
    }
    loadMaterials();
  </script>
</body>
</html>
