[build]
  # Pure static copy — no dependency install required
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Skip npm ci/install so beta packages cannot break the static site deploy
  NPM_FLAGS = "--ignore-scripts"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/pdf"
  to = "/.netlify/functions/pdf"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/premium"
  to = "/premium.html"
  status = 200
