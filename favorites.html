<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - StudyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><i class="fas fa-graduation-cap"></i></div><span>Study<span class="gradient-text">AI</span></span></a>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn-primary btn-sm" id="login-btn" onclick="openModal('auth-modal')">Login</button>
        <div class="user-menu hidden" id="user-menu"><span id="user-name" style="font-weight:600;"></span></div>
      </div>
    </div>
  </nav>
  <div class="page-header"><div class="container"><h1 class="page-title">Favorites</h1><p class="page-subtitle">Your saved PDFs, notes and videos</p></div></div>
  <section class="section" style="padding-top:1rem;">
    <div class="container">
      <div class="flex gap-2 mb-3">
        <button class="btn btn-primary btn-sm" onclick="showFav('pdfs')">PDFs</button>
        <button class="btn btn-secondary btn-sm" onclick="showFav('videos')">Videos</button>
      </div>
      <div id="fav-content" class="notes-grid"></div>
    </div>
  </section>
  <div class="modal-overlay" id="auth-modal">
    <div class="modal"><div class="modal-header"><h3>Login</h3><button class="modal-close" onclick="closeModal('auth-modal')"><i class="fas fa-times"></i></button></div>
    <div class="modal-body">
      <form id="login-form"><div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-input" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" class="form-input" required></div>
      <button type="submit" class="btn btn-primary w-full">Login</button></form>
      <form id="signup-form" class="hidden">
        <div class="form-group"><label>Name</label><input type="text" id="signup-name" class="form-input" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="signup-email" class="form-input" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="signup-password" class="form-input" required></div>
        <button type="submit" class="btn btn-primary w-full">Sign Up</button>
      </form>
      <button class="btn btn-secondary w-full mt-2" onclick="AuthManager.googleLogin()"><i class="fab fa-google"></i> Google</button>
    </div></div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="db.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
  <script>
    async function showFav(type) {
      if (!AuthManager.requireAuth()) return;
      const favs = DB.getFavorites(AuthManager.currentUser.uid);
      const ids = favs[type] || [];
      const el = document.getElementById('fav-content');
      if (type === 'pdfs') {
        el.innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
        let all = [];
        try { all = await (await fetch('/api/pdfs')).json(); } catch {}
        const pdfs = all.filter(p => ids.includes(p.id));
        el.innerHTML = pdfs.length ? pdfs.map(p =>
          '<div class="note-card"><div class="note-icon"><i class="fas fa-file-pdf"></i></div><h4 class="note-title">'+p.title+'</h4><div class="note-meta">'+p.exam+' · '+p.pages+' pages</div>'+
          '<div class="flex gap-2 mt-2"><a href="/api/pdfs/'+p.id+'/file" class="btn btn-primary btn-sm">Download</a>'+
          '<button class="btn btn-secondary btn-sm" onclick="DB.toggleFavorite(AuthManager.currentUser.uid,\'pdfs\','+p.id+');showFav(\'pdfs\')">Remove</button></div></div>'
        ).join('') : '<p style="color:var(--text-muted);grid-column:1/-1;">No saved PDFs. Browse <a href="pdf-library.html" style="color:var(--accent-primary);">PDF Library</a></p>';
      } else {
        const videos = DB.getVideos().filter(v => ids.includes(v.id));
        el.innerHTML = videos.length ? videos.map(v =>
          '<div class="note-card"><div class="note-icon"><i class="fas fa-play"></i></div><h4 class="note-title">'+v.title+'</h4><div class="note-meta">'+v.duration+'</div>'+
          '<a href="videos.html?v='+v.id+'" class="btn btn-primary btn-sm mt-2">Watch</a></div>'
        ).join('') : '<p style="color:var(--text-muted);grid-column:1/-1;">No saved videos.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (!AuthManager.currentUser) openModal('auth-modal');
      else showFav('pdfs');
    });
  </script>
</body>
</html>
