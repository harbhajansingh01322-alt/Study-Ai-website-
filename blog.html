<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - StudyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <span>Study<span class="gradient-text">AI</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="blog.html" class="nav-link active">Blog</a>
        <a href="study-material.html" class="nav-link">Study Material</a>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn-primary btn-sm" id="login-btn" onclick="openModal('auth-modal')">Login</button>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">📰 Blog & Updates</h1>
      <p class="page-subtitle">Exam tips, current affairs, scholarships & notifications</p>
    </div>
  </div>

  <section class="section" style="padding-top:1rem;">
    <div class="container">
      <div class="flex gap-2 mb-3" style="flex-wrap:wrap;" id="blog-filters">
        <button class="btn btn-primary btn-sm blog-filter active" data-cat="all">All</button>
        <button class="btn btn-secondary btn-sm blog-filter" data-cat="Exam Tips">Exam Tips</button>
        <button class="btn btn-secondary btn-sm blog-filter" data-cat="Current Affairs">Current Affairs</button>
        <button class="btn btn-secondary btn-sm blog-filter" data-cat="Scholarship">Scholarships</button>
        <button class="btn btn-secondary btn-sm blog-filter" data-cat="Notification">Notifications</button>
      </div>
      <div class="courses-grid" id="blog-grid"></div>
    </div>
  </section>

  <div class="modal-overlay" id="read-modal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header"><h3 id="read-title">Post</h3><button class="modal-close" onclick="closeModal('read-modal')"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <div id="read-content" style="white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);max-height:60vh;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <div class="modal-header"><h3>Login</h3><button class="modal-close" onclick="closeModal('auth-modal')"><i class="fas fa-times"></i></button></div>
      <div class="modal-body">
        <form id="login-form">
          <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-input" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-password" class="form-input" required></div>
          <button type="submit" class="btn btn-primary w-full">Login</button>
        </form>
        <form id="signup-form" class="hidden"></form>
        <button class="btn btn-secondary w-full mt-2" onclick="StudyAI.AuthManager.googleLogin()"><i class="fab fa-google"></i> Google</button>
      </div>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="db.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
  <script>
    let posts = [];
    const CAT_META = {
      'Exam Tips': { color: '#6366f1,#8b5cf6', icon: 'fa-lightbulb', var: '--accent-primary' },
      'Current Affairs': { color: '#10b981,#059669', icon: 'fa-newspaper', var: '--success' },
      'Scholarship': { color: '#f59e0b,#d97706', icon: 'fa-graduation-cap', var: '--warning' },
      'Notification': { color: '#ef4444,#dc2626', icon: 'fa-bell', var: '--danger' }
    };
    function metaFor(cat) { return CAT_META[cat] || { color: '#3b82f6,#2563eb', icon: 'fa-brain', var: '--info' }; }
    function fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function render(list) {
      document.getElementById('blog-grid').innerHTML = list.map(p => {
        const m = metaFor(p.category);
        return `
        <article class="course-card" onclick="openPost(${p.id})" style="cursor:pointer;">
          <div class="course-thumb" style="background:linear-gradient(135deg,${m.color});"><i class="fas ${m.icon}"></i></div>
          <div class="course-body">
            <div style="font-size:0.8rem;color:var(${m.var});font-weight:600;margin-bottom:0.35rem;">${(p.category || '').toUpperCase()}</div>
            <h3 class="course-title">${p.title}</h3>
            <p style="font-size:0.9rem;color:var(--text-secondary);margin:0.5rem 0;">${p.excerpt}</p>
            <div class="course-meta"><span>${fmtDate(p.createdAt)}</span><span>${p.readTime}</span></div>
          </div>
        </article>`;
      }).join('') || '<p style="color:var(--text-muted);grid-column:1/-1;">No blog posts yet. Ask an admin to publish one from the Admin panel.</p>';
    }

    function openPost(id) {
      const p = posts.find(x => x.id === id);
      if (!p) return;
      document.getElementById('read-title').textContent = p.title;
      document.getElementById('read-content').textContent = p.content;
      openModal('read-modal');
    }

    document.querySelectorAll('.blog-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.blog-filter').forEach(b => { b.classList.remove('active','btn-primary'); b.classList.add('btn-secondary'); });
        btn.classList.add('active','btn-primary'); btn.classList.remove('btn-secondary');
        const cat = btn.dataset.cat;
        render(cat === 'all' ? posts : posts.filter(p => p.category === cat));
      });
    });

    async function loadPosts() {
      document.getElementById('blog-grid').innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
      try {
        const res = await fetch('/api/blog');
        posts = await res.json();
      } catch {
        posts = [];
      }
      render(posts);
    }
    loadPosts();
  </script>
</body>
</html>
