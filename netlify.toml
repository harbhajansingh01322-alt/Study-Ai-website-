[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/pdf"
  to = "/.netlify/functions/pdf"
  status = 200

# Keep legacy /pages /js /css links working
[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/:splat"
  status = 200

# Explicit premium route (SPA-style safety)
[[redirects]]
  from = "/premium"
  to = "/premium.html"
  status = 200
