<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - StudyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <span>Study<span class="gradient-text">AI</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">Contact Us</h1>
      <p class="page-subtitle">We'd love to hear from you</p>
    </div>
  </div>

  <section class="section" style="padding-top:1rem;">
    <div class="container">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;max-width:900px;margin:0 auto;" class="contact-grid">
        <div class="card" style="padding:2rem;">
          <h3 class="mb-3">Send a Message</h3>
          <form onsubmit="event.preventDefault();submitContact(this);">
            <div class="form-group"><label>Name</label><input type="text" class="form-input" required></div>
            <div class="form-group"><label>Email</label><input type="email" class="form-input" required></div>
            <div class="form-group"><label>Subject</label><input type="text" class="form-input" required></div>
            <div class="form-group"><label>Message</label><textarea class="form-input" rows="4" required></textarea></div>
            <button type="submit" class="btn btn-primary w-full">Send Message</button>
          </form>
        </div>
        <div>
          <div class="card" style="padding:1.5rem;margin-bottom:1rem;">
            <div class="flex gap-3 items-center">
              <div class="stat-card-icon purple"><i class="fas fa-envelope"></i></div>
              <div>
                <div style="font-weight:600;">Email</div>
                <div style="color:var(--text-muted);font-size:0.9rem;">support@studyai.com</div>
              </div>
            </div>
          </div>
          <div class="card" style="padding:1.5rem;margin-bottom:1rem;">
            <div class="flex gap-3 items-center">
              <div class="stat-card-icon green"><i class="fab fa-telegram"></i></div>
              <div>
                <div style="font-weight:600;">Telegram</div>
                <div style="color:var(--text-muted);font-size:0.9rem;">@StudyAISupport</div>
              </div>
            </div>
          </div>
          <div class="card" style="padding:1.5rem;">
            <div class="flex gap-3 items-center">
              <div class="stat-card-icon orange"><i class="fas fa-clock"></i></div>
              <div>
                <div style="font-weight:600;">Response Time</div>
                <div style="color:var(--text-muted);font-size:0.9rem;">Within 24 hours</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="db.js"></script>
  <script src="firebase-config.js"></script>
  <script src="main.js"></script>
  <script>
    async function submitContact(form) {
      const inputs = form.querySelectorAll('input, textarea');
      const name = inputs[0].value.trim();
      const email = inputs[1].value.trim();
      const subject = inputs[2].value.trim();
      const message = inputs[3].value.trim();
      if (!name || !email || !subject || !message) { Toast.show('Fill all fields','error'); return; }
      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name, email, subject, message })
        });
        if (!res.ok) throw new Error('failed');
        Toast.show('Message sent successfully! We will reply soon.','success');
        form.reset();
      } catch {
        Toast.show('Could not send message. Please try again.','error');
      }
    }
  </script>
  <style>@media(max-width:768px){.contact-grid{grid-template-columns:1fr!important;}}</style>
</body>
</html>
